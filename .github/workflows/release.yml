name: Build & Release

on:
  push:
    branches: [port-26.3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VER}-build.${{ github.run_number }}"
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-dev.jar' | head -1)
          echo "Releasing $JAR as $TAG"
          gh release create "$TAG" "$JAR" \
            --title "$TAG" \
            --notes "Автосборка из ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest
